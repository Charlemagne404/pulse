<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | Continental Pulse</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
        background: #030913;
        color: #f2f5fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top left, rgba(40, 84, 145, 0.18), transparent 26rem),
          linear-gradient(180deg, #040912, #030913 42%, #02070f);
      }

      main {
        width: min(680px, 100%);
        padding: 40px;
        border: 1px solid rgba(133, 151, 177, 0.17);
        border-radius: 24px;
        background: rgba(11, 21, 35, 0.96);
        box-shadow: 0 34px 80px rgba(2, 7, 13, 0.46);
      }

      span {
        display: inline-block;
        margin-bottom: 12px;
        color: #4f95ff;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(2.4rem, 7vw, 4rem);
        line-height: 0.96;
      }

      p {
        margin: 0 0 24px;
        color: #b1bed1;
        font-size: 1rem;
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 18px;
        border-radius: 999px;
        background: linear-gradient(135deg, #d3a341, #f0c86c);
        color: #08111a;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <span>404</span>
      <h1>That page does not exist.</h1>
      <p>The link may be outdated, or the route may have moved. Return to the main site and continue from there.</p>
      <a href="/">Go to Pulse</a>
    </main>
  </body>
</html>
